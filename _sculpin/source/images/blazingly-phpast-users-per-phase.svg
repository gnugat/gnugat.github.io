<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" width="1040" height="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Users handled per phase, throttled to a quarter of a CPU</title>
<desc id="d">Classic Mode goes from 250 users (p0) to 1,500 (p14). Worker Mode goes from 1,000 users (p0) to 5,250 (p14).</desc>
<rect width="1040" height="460" fill="#363a4f"/>
<text x="80" y="36" fill="#cad3f5" font-size="20" font-weight="600">Users handled, phase by phase</text>
<text x="80" y="58" fill="#b8c0e0" font-size="13">Symfony 8.1 on FrankenPHP, throttled to a quarter of a CPU core</text>
<line x1="660" y1="40" x2="678" y2="40" stroke="#3987e5" stroke-width="2"/><circle cx="669" cy="40" r="4" fill="#3987e5" stroke="#363a4f" stroke-width="2"/>
<text x="684" y="44" fill="#b8c0e0" font-size="12">Worker Mode</text>
<line x1="770" y1="40" x2="788" y2="40" stroke="#d95926" stroke-width="2"/><circle cx="779" cy="40" r="4" fill="#d95926" stroke="#363a4f" stroke-width="2"/>
<text x="794" y="44" fill="#b8c0e0" font-size="12">Classic Mode</text>
<line x1="80" y1="400.0" x2="860" y2="400.0" stroke="#494d64" stroke-width="1"/>
<text x="70" y="404.0" fill="#a5adcb" font-size="12" text-anchor="end">0</text>
<line x1="80" y1="346.7" x2="860" y2="346.7" stroke="#494d64" stroke-width="1"/>
<text x="70" y="350.7" fill="#a5adcb" font-size="12" text-anchor="end">1,000</text>
<line x1="80" y1="293.3" x2="860" y2="293.3" stroke="#494d64" stroke-width="1"/>
<text x="70" y="297.3" fill="#a5adcb" font-size="12" text-anchor="end">2,000</text>
<line x1="80" y1="240.0" x2="860" y2="240.0" stroke="#494d64" stroke-width="1"/>
<text x="70" y="244.0" fill="#a5adcb" font-size="12" text-anchor="end">3,000</text>
<line x1="80" y1="186.7" x2="860" y2="186.7" stroke="#494d64" stroke-width="1"/>
<text x="70" y="190.7" fill="#a5adcb" font-size="12" text-anchor="end">4,000</text>
<line x1="80" y1="133.3" x2="860" y2="133.3" stroke="#494d64" stroke-width="1"/>
<text x="70" y="137.3" fill="#a5adcb" font-size="12" text-anchor="end">5,000</text>
<line x1="80" y1="80.0" x2="860" y2="80.0" stroke="#494d64" stroke-width="1"/>
<text x="70" y="84.0" fill="#a5adcb" font-size="12" text-anchor="end">6,000</text>
<text x="80.0" y="422" fill="#b8c0e0" font-size="12" font-weight="600" text-anchor="middle">p0</text>
<text x="80.0" y="438" fill="#a5adcb" font-size="11" text-anchor="middle">Defaults</text>
<text x="158.0" y="422" fill="#b8c0e0" font-size="12" font-weight="600" text-anchor="middle">p3</text>
<text x="158.0" y="438" fill="#a5adcb" font-size="11" text-anchor="middle">Tuned config</text>
<text x="236.0" y="422" fill="#b8c0e0" font-size="12" font-weight="600" text-anchor="middle">p6</text>
<text x="236.0" y="438" fill="#a5adcb" font-size="11" text-anchor="middle">Read Model</text>
<text x="314.0" y="422" fill="#b8c0e0" font-size="12" font-weight="600" text-anchor="middle">p7</text>
<text x="314.0" y="438" fill="#a5adcb" font-size="11" text-anchor="middle">JsonStreamer</text>
<text x="392.0" y="422" fill="#b8c0e0" font-size="12" font-weight="600" text-anchor="middle">p8</text>
<text x="392.0" y="438" fill="#a5adcb" font-size="11" text-anchor="middle">SQL reads</text>
<text x="470.0" y="422" fill="#b8c0e0" font-size="12" font-weight="600" text-anchor="middle">p9</text>
<text x="470.0" y="438" fill="#a5adcb" font-size="11" text-anchor="middle">Persistent</text>
<text x="548.0" y="422" fill="#b8c0e0" font-size="12" font-weight="600" text-anchor="middle">p10</text>
<text x="548.0" y="438" fill="#a5adcb" font-size="11" text-anchor="middle">DBAL writes</text>
<text x="626.0" y="422" fill="#b8c0e0" font-size="12" font-weight="600" text-anchor="middle">p11</text>
<text x="626.0" y="438" fill="#a5adcb" font-size="11" text-anchor="middle">No ORM</text>
<text x="704.0" y="422" fill="#b8c0e0" font-size="12" font-weight="600" text-anchor="middle">p12</text>
<text x="704.0" y="438" fill="#a5adcb" font-size="11" text-anchor="middle">No Serializer</text>
<text x="782.0" y="422" fill="#b8c0e0" font-size="12" font-weight="600" text-anchor="middle">p13</text>
<text x="782.0" y="438" fill="#a5adcb" font-size="11" text-anchor="middle">Prepared</text>
<text x="860.0" y="422" fill="#b8c0e0" font-size="12" font-weight="600" text-anchor="middle">p14</text>
<text x="860.0" y="438" fill="#a5adcb" font-size="11" text-anchor="middle">SQLite JSON</text>
